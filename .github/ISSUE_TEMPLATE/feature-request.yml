name: 功能建议
description: 说明一个具体的使用场景
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前遇到的问题或使用场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样操作、得到什么结果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方法、边界或参考（可选）
      description: '请注明平台和语言方向，不提供密钥或私人内容。'
