[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-translator"
version = "0.5.0"
description = "A small Windows desktop panel for screen text translation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "COPYRIGHT", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "rapidocr>=3.8.2",
    "onnxruntime>=1.20",
    "numpy>=1.26",
    "httpx>=0.27",
    "keyring>=25.7,<26",
    "ctranslate2==4.8.2",
    "sentencepiece==0.2.2",
    "minisbd==0.9.5",
]

[project.scripts]
screen-translator = "screen_translator.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
screen_translator = ["diagnostics/offline-cases.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
