name: 问题反馈
description: 报告可以复现的运行或界面问题
title: '[Bug] '
labels: []
body:
  - type: markdown
    attributes:
      value: '请先移除密钥、账号、私人原文和配置文件。安全漏洞按 SECURITY.md 处理。'
  - type: input
    id: version
    attributes:
      label: 应用版本与运行方式
      placeholder: '例如：0.5.0，源码启动'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows、CPU 架构与显示环境
      placeholder: '例如：Windows 11 x64，两个显示器，缩放 100% / 150%'
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options: [启动或安装, 语言与在线平台, OCR 或截图, 离线翻译, 字体与界面, 会话或设置, 其他]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      placeholder: '用合成文字说明操作步骤、是否每次出现；在线平台只填写名称和模型，不填写密钥。'
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或自检结果（可选）
      description: '不要附个人设置、会话文件或 API 响应正文。'
  - type: checkboxes
    id: privacy
    attributes:
      label: 数据检查
      options:
        - label: 我已确认内容不含密钥、私人原文或个人配置。
          required: true
